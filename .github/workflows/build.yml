name: Build TYRO KANJI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract exact TYRO ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/TYRO_KANJI_CURRENT_BUILD_FIXED_2.zip"
          test -f "$ZIP_FILE" || { echo "ERROR: expected ZIP missing: $ZIP_FILE"; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/tyro_extracted"
          mkdir -p "$GITHUB_WORKSPACE/tyro_extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/tyro_extracted"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/tyro_extracted" -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs -r dirname)
          test -n "$PROJECT_DIR" || { echo "ERROR: Gradle project not found."; exit 1; }
          echo "Project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload extracted source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-extracted-source-${{ github.run_id }}
          path: ${{ steps.project.outputs.dir }}
          if-no-files-found: error
          retention-days: 1

      - name: Apply compile-safe source fixes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/tyro/kanji/MainActivity.kt"
          test -f "$FILE" || { echo "ERROR: MainActivity.kt missing"; exit 1; }
          sed -i 's/\.toFloat\([^()]\|$\)/.toFloat()\1/g' "$FILE"
          sed -i 's/ThemeChoice("Sunset (Dark)", true, selectedDark)/ThemeChoice("Sunset (Dark)", "dark", selectedDark)/g' "$FILE"
          sed -i 's/ThemeChoice("Daylight (Light)", false, !selectedDark)/ThemeChoice("Daylight (Light)", "light", !selectedDark)/g' "$FILE"

      - name: Check Gradle version
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --version

      - name: Build TYRO KANJI
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)
          test -n "$APK" || { echo "ERROR: APK was not generated."; exit 1; }
          echo "APK successfully generated: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-KANJI-DEBUG-APK
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
